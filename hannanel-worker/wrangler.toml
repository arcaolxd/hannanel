name = "hannanel-news-worker"
main = "src/index.js"
compatibility_date = "2024-12-01"

# KV Namespace — almacena las noticias
# Después de crear el namespace con `npx wrangler kv namespace create NEWS_KV`
# pega aquí el ID que te da
[[kv_namespaces]]
binding = "NEWS_KV"
id = "PEGA_TU_ID_AQUI"

# Cron: cada 5 minutos busca noticias nuevas
[triggers]
crons = ["*/5 * * * *"]
